[project]
name = "plybench"
version = "1.1.0"
description = "PlyBench is a benchmark suite for evaluating the performance of LLMs and LLM Agents in simple game environments."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jakub Rada", email = "radajak5@fel.cvut.cz" }]
keywords = [
    "llm",
    "large-language-models",
    "ai",
    "artificial-intelligence",
    "game-theory",
    "benchmark",
    "games",
    "agents",
    "evaluation",
    "openspiel",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Games/Entertainment :: Board Games",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=2.5.1",
    "open-spiel>=2.0.1",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "scipy>=1.18.0",
    "tqdm>=4.69.1",
]

[project.optional-dependencies]
openai = ["openai>=2.48.0"]
gemini = ["google-genai>=2.14.0"]
grok = ["openai>=2.48.0"]
anthropic = ["anthropic[aiohttp]>=0.120.2"]
# metacentrum is an OpenAI-compatible endpoint and reuses the openai SDK
metacentrum = ["openai>=2.48.0"]
huggingface = ["torch>=2.4.0", "transformers>=4.44.0"]
all = ["openai>=2.48.0", "google-genai>=2.14.0", "anthropic[aiohttp]>=0.120.2", "torch>=2.4.0", "transformers>=4.44.0"]

[project.urls]
Homepage = "https://plybench.jakubrada.com"
Repository = "https://github.com/radajakub/plybench"
Issues = "https://github.com/radajakub/plybench/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plybench"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 180
target-version = "py312"

[tool.ruff.lint]
# Minimal set: pyflakes (F), essential pycodestyle errors (E4/E7/E9), import sorting (I).
select = ["E4", "E7", "E9", "F", "I"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.0",
    # provider SDKs are optional extras; include the API-based ones so the test suite runs
    "openai>=2.48.0",
    "google-genai>=2.14.0",
    "anthropic[aiohttp]>=0.120.2",
]
